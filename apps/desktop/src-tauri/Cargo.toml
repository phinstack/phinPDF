[package]
name = "phinpdf"
version = "0.0.0"
description = "Free, open-source PDF viewer and editor"
authors = ["The phinPDF Authors"]
license = "Apache-2.0"
repository = "https://github.com/phinstack/phinPDF"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "phinpdf_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Adds the `e2e_report` command for the desktop smoke test in CI. Never in releases.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
