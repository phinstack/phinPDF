name: Deploy web app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages
    # Deploy only from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Ask the Pages API directly. (The has_pages flag on the event payload can stay
      # false until the first deployment, so it can't gate the first deployment.)
      - name: Check that Pages is enabled with source "GitHub Actions"
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null); then
            echo "Pages build type: $build_type"
            if [ "$build_type" != "workflow" ]; then
              echo "::error::Pages is enabled but its source is '$build_type'. Set Settings → Pages → Source to 'GitHub Actions'."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled. Turn it on in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pages.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.pages.outputs.enabled == 'true'
      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        run: pnpm build
        env:
          PHINPDF_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
